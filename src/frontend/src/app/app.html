<a
  class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-10 focus:rounded focus:bg-feuille focus:px-4 focus:py-3 focus:text-surface"
  href="#contenu"
  >Aller au contenu</a
>

<header class="border-b border-sauge bg-surface">
  <div class="mx-auto flex max-w-screen-xl flex-wrap items-center gap-x-6 gap-y-1 px-4 py-2">
    <h1 class="text-2xl font-bold text-feuille">Sôrô</h1>
    @if (showMenu()) {
      <nav aria-label="Navigation principale" class="flex flex-wrap gap-1">
        @if (hasSession()) {
          <a class="btn" routerLink="/vente" routerLinkActive="border-feuille text-feuille" ariaCurrentWhenActive="page">Vente</a>
        } @else {
          <a class="btn" routerLink="/ouverture" routerLinkActive="border-feuille text-feuille" ariaCurrentWhenActive="page">Ouverture</a>
        }
        <a class="btn" routerLink="/file" routerLinkActive="border-feuille text-feuille" ariaCurrentWhenActive="page">
          File d’envoi
          @if (sync.counts().pending > 0) {
            <span class="amount ml-2 rounded bg-sauge px-2 text-sm">{{ sync.counts().pending }}</span>
          }
        </a>
        @if (showManagement()) {
          <a class="btn" routerLink="/gestion" routerLinkActive="border-feuille text-feuille" ariaCurrentWhenActive="page">Gestion</a>
        }
        @if (hasSession()) {
          <a class="btn" routerLink="/cloture" routerLinkActive="border-feuille text-feuille" ariaCurrentWhenActive="page">Clôture</a>
        }
      </nav>
    }
    @if (user(); as current) {
      <div class="ml-auto flex items-center gap-3 text-base">
        <span class="text-ardoise">{{ current.displayName }}</span>
        <button type="button" class="btn" (click)="logout()">Se déconnecter</button>
      </div>
    }
  </div>
  <app-network-banner />
</header>

<main id="contenu" class="mx-auto max-w-screen-xl px-4 py-4">
  <router-outlet />
</main>
