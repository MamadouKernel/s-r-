# Frontend Sôrô : fichiers statiques de la PWA, et relais de /api vers l'API (même origine : pas de CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # L'API est atteinte sous le nom « api » (réseau du déploiement) ; elle fait confiance à CE relais (ForwardedHeaders:KnownProxies).
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        client_max_body_size 12m;
    }

    location = /health {
        proxy_pass http://api:8080/health/ready;
    }

    # Le service worker et le manifeste ne sont jamais mis en cache : une nouvelle version doit être vue tout de suite.
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Fichiers à empreinte : cache long.
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Toute autre adresse est une page de l'application.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
